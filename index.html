<!doctype html>
<html lang="en-ZA">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SA Inflation Calculator</title>
  <meta name="description" content="Adjust a rand amount for South African inflation using official Stats SA headline CPI.">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <header class="page-header">
      <!-- Flag of South Africa, drawn on a 9 × 6 grid. -->
      <svg class="flag" viewBox="0 0 9 6" role="img" aria-label="Flag of South Africa">
        <clipPath id="flag-triangle"><path d="M0,0 4.5,3 0,6"/></clipPath>
        <clipPath id="flag-edge"><path d="M0,0V6H9V0z"/></clipPath>
        <path fill="#E03C31" d="M0,0H9V3H0z"/>
        <path fill="#001489" d="M0,3H9V6H0z"/>
        <g clip-path="url(#flag-edge)" fill="none">
          <path stroke="#FFF" stroke-width="2" d="M0,0 4.5,3 0,6M4.5,3H9"/>
          <path fill="#000" stroke="#FFB81C" stroke-width="2.4" clip-path="url(#flag-triangle)" d="M0,0 4.5,3 0,6"/>
          <path stroke="#007749" stroke-width="1.2" d="M0,0 4.5,3 0,6M4.5,3H9"/>
        </g>
      </svg>
      <h1>South African Inflation Calculator</h1>
    </header>
    <p class="intro">Compare the buying power of the rand between two months, based on the average change in consumer prices (Stats SA headline CPI).</p>

    <form id="calculator" novalidate>
      <label class="amount">
        Amount (R)
        <input id="amount" type="number" min="0" step="0.01" value="100" inputmode="decimal" required>
      </label>
      <fieldset class="month-picker">
        <legend>From</legend>
        <select id="start-month" aria-label="Start month"></select>
        <select id="start-year" aria-label="Start year"></select>
      </fieldset>
      <fieldset class="month-picker">
        <legend>To</legend>
        <select id="end-month" aria-label="End month"></select>
        <select id="end-year" aria-label="End year"></select>
      </fieldset>
    </form>

    <section id="result" aria-live="polite">
      <p class="loading">Loading CPI data…</p>
    </section>

    <footer id="data-info"></footer>
  </main>
  <script src="app.js"></script>
</body>
</html>
