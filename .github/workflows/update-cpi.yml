# Fetches the latest South African CPI daily and commits data/cpi.json when it changes.
# GitHub Pages redeploys the site automatically after each commit.
name: Update CPI data

on:
  schedule:
    - cron: "0 6 * * *"  # 06:00 UTC daily
  workflow_dispatch:      # allow manual runs from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run tests
        run: python -m unittest discover -s tests

      - name: Update CPI data
        run: python scripts/update_cpi.py

      - name: Commit changes
        run: |
          if git diff --quiet data/cpi.json; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/cpi.json
          git commit -m "Update CPI data"
          git push
